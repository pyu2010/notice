<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수온-연월 그래프</title>
<style>
body {
font-family: Arial, sans-serif;
background-color: #f4f7fb;
text-align: center;
margin: 0;
padding: 30px;
}
.container {
max-width: 800px;
margin: auto;
background-color: white;
padding: 30px;
border-radius: 15px;
box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}
input {
padding: 10px;
margin: 5px;
font-size: 16px;
}
button {
padding: 10px 15px;
margin: 5px;
font-size: 16px;
cursor: pointer;
}
#dataList {
margin: 20px;
}
#result {
margin-top: 20px;
font-size: 18px;
font-weight: bold;
}
.chart-container {
height: 400px;
position: relative; /* 안정적인 렌더링을 위해 추가 */
width: 100%;
}
</style>
</head>
<body>

<div class="container">
    <h1>수온-연월 그래프</h1>
    <p>측정 연월과 수온을 입력하세요.</p>

    <input type="month" id="dateInput">
    <input type="number" id="temperatureInput" placeholder="수온(℃)" step="0.1">
    <br>
    <button onclick="addData()">데이터 추가</button>
    <button onclick="resetData()">초기화</button>

    <div id="dataList"></div>

    <div class="chart-container">
        <canvas id="temperatureChart"></canvas>
    </div>

    <div id="result"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
let waterData = [];
let temperatureChart;

// 페이지 로드가 완료된 후 차트를 초기화하도록 변경
window.onload = function() {
    const chartCanvas = document.getElementById("temperatureChart");
    temperatureChart = new Chart(chartCanvas, {
        type: "line",
        data: {
            labels: [],
            datasets: [{
                label: "수온 (℃)",
                data: [],
                borderColor: "blue",
                backgroundColor: "blue",
                borderWidth: 2,
                tension: 0,
                pointRadius: 5
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: { title: { display: true, text: "연월" } },
                y: { title: { display: true, text: "수온 (℃)" } }
            }
        }
    });
};

function addData() {
    const date = document.getElementById("dateInput").value;
    const temperature = Number(document.getElementById("temperatureInput").value);

    if (date === "" || isNaN(temperature)) {
        alert("연월과 수온을 모두 입력하세요.");
        return;
    }

    waterData.push({ date: date, temperature: temperature });
    waterData.sort((a, b) => a.date.localeCompare(b.date));

    updateProgram();
    document.getElementById("temperatureInput").value = "";
}

function updateProgram() {
    updateList();
    updateChart();
    analyzeTemperature();
}

function updateList() {
    const dataList = document.getElementById("dataList");
    dataList.innerHTML = "<h3>입력된 데이터</h3>";
    for (let i = 0; i < waterData.length; i++) {
        dataList.innerHTML += waterData[i].date + " → " + waterData[i].temperature + "℃<br>";
    }
}

function updateChart() {
    if (!temperatureChart) return; // 차트가 아직 생성 안됐으면 리턴
    
    let dates = [];
    let temperatures = [];

    for (let i = 0; i < waterData.length; i++) {
        dates.push(waterData[i].date);
        temperatures.push(waterData[i].temperature);
    }

    temperatureChart.data.labels = dates;
    temperatureChart.data.datasets[0].data = temperatures;
    temperatureChart.update();
}

function analyzeTemperature() {
    const result = document.getElementById("result");
    if (waterData.length < 2) {
        result.innerHTML = "데이터를 2개 이상 입력하면 수온 변화를 분석합니다.";
        return;
    }

    let temperatures = waterData.map(d => d.temperature);
    const firstTemperature = temperatures[0];
    const lastTemperature = temperatures[temperatures.length - 1];
    const change = lastTemperature - firstTemperature;
    const maxTemperature = Math.max(...temperatures);
    const minTemperature = Math.min(...temperatures);

    let trend = change > 0 ? "수온이 전체적으로 상승했습니다." : (change < 0 ? "수온이 전체적으로 하락했습니다." : "처음과 마지막 수온이 같습니다.");

    result.innerHTML = trend
        + "<br>수온 변화량: " + change.toFixed(1) + "℃"
        + "<br>최고 수온: " + maxTemperature + "℃"
        + "<br>최저 수온: " + minTemperature + "℃";
}

function resetData() {
    waterData = [];
    if (temperatureChart) {
        temperatureChart.data.labels = [];
        temperatureChart.data.datasets[0].data = [];
        temperatureChart.update();
    }
    document.getElementById("dataList").innerHTML = "";
